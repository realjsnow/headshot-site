<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Photos With Jason — Las Vegas Headshot Photography</title>
<meta name="description" content="Book a professional headshot session with Jason Snow, a Las Vegas headshot photographer for actors, models, and creatives. Actor headshots, personal branding photos, and LinkedIn headshots in Las Vegas, NV.">
<meta name="keywords" content="Las Vegas headshot photographer, actor headshots Las Vegas, headshot photography Las Vegas, professional headshots Las Vegas, actor headshots Nevada, personal branding photographer Las Vegas, LinkedIn headshots Las Vegas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="flash-overlay" id="flash-overlay"></div>
<script>
  if (sessionStorage.getItem('flashed')) {
    document.getElementById('flash-overlay').remove();
  } else {
    sessionStorage.setItem('flashed', '1');
  }
</script>

<main class="card">

  <header class="header">
    <h1>Book Photos With Jason</h1>
    <p class="tagline">For Actors &amp; Creatives in Las Vegas</p>
  </header>

  <!-- PHOTOS: swap the src on each img below to your real files (drop them in the /photos folder).
       alt = for search engines. data-caption = shown under the photo in the lightbox.
       To add another photo, copy one whole <div class="photo"> block and paste it in. -->
  <section class="photos" id="photo-slider">
    <div class="photo-track" id="photo-track">
      <div class="photo"><img src="photos/photo1.svg" alt="Las Vegas actor headshot with soft natural light" data-caption="Actor headshot in natural light" draggable="false"></div>
      <div class="photo"><img src="photos/photo2.svg" alt="Theatrical headshot for a Las Vegas stage actor" data-caption="Theatrical headshot for stage" draggable="false"></div>
      <div class="photo"><img src="photos/photo3.svg" alt="Bright commercial headshot for a Las Vegas actor" data-caption="Commercial and on-camera look" draggable="false"></div>
      <div class="photo"><img src="photos/photo4.svg" alt="Studio headshot on a clean backdrop in Las Vegas" data-caption="Studio session, clean backdrop" draggable="false"></div>
      <div class="photo"><img src="photos/photo5.svg" alt="Outdoor Las Vegas portrait shot at golden hour" data-caption="Outdoor portrait at golden hour" draggable="false"></div>
      <div class="photo"><img src="photos/photo6.svg" alt="Creative portrait of a Las Vegas musician" data-caption="Creative portrait for musicians" draggable="false"></div>
      <div class="photo"><img src="photos/photo7.svg" alt="Personal branding headshot for a Las Vegas creative" data-caption="Personal branding portrait" draggable="false"></div>
      <div class="photo"><img src="photos/photo8.svg" alt="Professional LinkedIn headshot taken in Las Vegas" data-caption="Professional headshot for LinkedIn" draggable="false"></div>
      <div class="photo"><img src="photos/photo9.svg" alt="Portrait of a Las Vegas dancer and performer" data-caption="Dancer and performer portrait" draggable="false"></div>
      <div class="photo"><img src="photos/photo10.svg" alt="Dramatic actor headshot with moody lighting in Las Vegas" data-caption="Actor headshot, dramatic light" draggable="false"></div>
    </div>
  </section>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Close photo">&larr; Back</button>
    <figure class="lightbox-figure">
      <img class="lightbox-img" id="lightbox-img" src="" alt="" draggable="false">
      <figcaption class="lightbox-caption" id="lightbox-caption"></figcaption>
    </figure>
  </div>

  <!-- LINKS: replace each placeholder href below with your real link/number/email. -->
  <section class="links">
    <a class="btn btn-primary sparkle-wrap" href="https://fantastical.app/realjsnow/headshots-with-jason-snow" target="_blank" rel="noopener">
      <svg class="sparkle sp-twinkle sw1" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <svg class="sparkle sp-twinkle sw2" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <svg class="sparkle sp-twinkle sw3 silver" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <svg class="sparkle sp-twinkle sw4" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <svg class="sparkle sp-twinkle sw5 silver" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <svg class="sparkle sp-twinkle sw6" viewBox="0 0 24 24"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <span class="btn-label">Book a Headshot</span>
    </a>
    <!-- Number is assembled by text-link.js at runtime so it is not in the page source for scrapers. -->
    <a class="btn btn-text" id="text-btn" href="#">
      <span class="btn-text-label">Text Me</span>
    </a>
    <a class="btn" href="about.html">
      About Me
    </a>
  </section>

  <footer class="footer">
    <p>&copy; <span id="year"></span> Jason Snow</p>
  </footer>

</main>

<script src="protect-images.js"></script>
<script src="slider.js"></script>
<script src="text-link.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
