<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Jason — Las Vegas Headshot Photographer</title>
<meta name="description" content="Meet Jason Snow, a Las Vegas headshot photographer working with actors, models, and creatives. See sample work and book an actor headshot session in Las Vegas, NV.">
<meta name="keywords" content="Las Vegas headshot photographer, actor headshots Las Vegas, headshot photography Las Vegas, professional headshots Las Vegas, actor headshots Nevada, personal branding photographer Las Vegas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="about-page">

<div class="flash-overlay" id="flash-overlay"></div>
<script>
  if (sessionStorage.getItem('flashed')) {
    document.getElementById('flash-overlay').remove();
  } else {
    sessionStorage.setItem('flashed', '1');
  }
</script>

<div class="about-wrap">

  <a class="btn back-btn" href="index.html">&larr; Back</a>

  <header class="about-header">
    <h1>Jason Snow</h1>
    <p class="about-tagline">Director, Photographer, and Actor</p>
  </header>

  <!-- AVATAR + BIO: replace photos/avatar.svg with a real headshot, and swap the placeholder paragraph below.
       The avatar floats, so the bio text wraps around it. -->
  <section class="about-intro">
    <div class="avatar">
      <img src="photos/avatar.svg" alt="Jason Snow, Las Vegas photographer, director, and actor">
    </div>
    <p class="about-bio-text">
      Jason Snow is a Las Vegas based photographer and director specializing in headshots
      that make actors shine. He is also an actor and director with a unique eye for what
      makes actors stand out to casting directors.
    </p>
  </section>

  <!-- GALLERY: replace the two src attributes below with real photos (drop them in the /photos folder).
       Keep the alt text and caption descriptive — both help image search. -->
  <section class="about-gallery">
    <figure class="about-photo photo-a">
      <div class="about-photo-frame"><img src="photos/about1.svg" alt="Behind the scenes at a Las Vegas headshot session"></div>
      <figcaption class="about-caption">Behind the scenes at a Las Vegas session</figcaption>
    </figure>
    <figure class="about-photo photo-b">
      <div class="about-photo-frame"><img src="photos/about2.svg" alt="Natural light setup used for Las Vegas actor headshots"></div>
      <figcaption class="about-caption">Natural light setup for actor headshots</figcaption>
    </figure>
  </section>

  <footer class="about-footer">
    <p>&copy; <span id="year"></span> Jason Snow</p>
  </footer>

</div>

<script src="protect-images.js"></script>
<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
